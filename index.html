<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DG STORE - Premium Accounts</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at 20% 30%, rgba(120, 0, 255, 0.15), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.15), transparent 50%);
    z-index: -1;
    animation: bgMove 15s ease-in-out infinite alternate;
  }

  @keyframes bgMove {
    from { transform: scale(1) rotate(0deg); }
    to { transform: scale(1.2) rotate(5deg); }
  }

  header {
    text-align: center;
    padding: 30px 20px;
    animation: fadeDown 1s ease;
  }

  .logo {
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(90deg, #ff00cc, #3333ff, #00ffff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientMove 4s ease infinite;
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(255, 0, 204, 0.4);
  }

  @keyframes gradientMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .tagline {
    color: #b0b0ff;
    margin-top: 8px;
    font-size: 1rem;
    letter-spacing: 2px;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    text-align: center;
    font-size: 1.5rem;
    margin: 30px 0 20px;
    color: #fff;
    display: inline-block;
    width: 100%;
  }

  .section-title span {
    background: linear-gradient(90deg, #ff00cc, #00ffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    padding: 0 15px;
  }

  .section-title::after {
    content: '';
    display: block;
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, #ff00cc, #00ffff);
    margin: 10px auto 0;
    border-radius: 3px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 22px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0;
    transform: translateY(40px);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .card.visible {
    opacity: 1;
    transform: translateY(0);
    animation: cardIn 0.7s ease forwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, rgba(255, 0, 204, 0.15), transparent 30%);
    animation: rotate 6s linear infinite;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .card:hover::before { opacity: 1; }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .card:hover {
    transform: translateY(-10px) scale(1.03);
    border-color: rgba(255, 0, 204, 0.5);
    box-shadow: 0 20px 50px rgba(255, 0, 204, 0.3),
                0 0 30px rgba(0, 200, 255, 0.2);
  }

  .card-inner { position: relative; z-index: 1; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .icon {
    font-size: 2rem;
    filter: drop-shadow(0 0 8px rgba(255, 0, 204, 0.6));
    animation: iconPulse 2s ease-in-out infinite;
  }

  @keyframes iconPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }

  .plan {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    font-size: 0.9rem;
    transition: all 0.3s;
  }

  .plan:last-child { border-bottom: none; }

  .plan:hover {
    padding-left: 8px;
    color: #00ffff;
  }

  .plan-info {
    color: #d0d0ff;
    flex: 1;
  }

  .plan-type {
    font-size: 0.72rem;
    color: #8888cc;
    display: block;
    margin-top: 2px;
  }

  .price {
    font-weight: 700;
    color: #ff00cc;
    text-shadow: 0 0 10px rgba(255, 0, 204, 0.5);
    white-space: nowrap;
    margin-left: 10px;
  }

  /* Order Section */
  .order-section {
    max-width: 600px;
    margin: 60px auto 40px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 35px 30px;
    opacity: 0;
    transform: translateY(40px);
    transition: all 0.8s ease;
  }

  .order-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .order-section h2 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 25px;
    background: linear-gradient(90deg, #ff00cc, #00ffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    margin-bottom: 7px;
    color: #b0b0ff;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 13px 16px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: #ff00cc;
    box-shadow: 0 0 20px rgba(255, 0, 204, 0.4);
    background: rgba(0, 0, 0, 0.5);
  }

  .form-group select option { background: #1a1a2e; color: #fff; }

  /* ===== RECEIPT UPLOAD ===== */
  .upload-area {
    position: relative;
    border: 2px dashed rgba(255, 0, 204, 0.5);
    border-radius: 14px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s ease;
    background: rgba(255, 0, 204, 0.05);
    overflow: hidden;
  }

  .upload-area:hover,
  .upload-area.dragover {
    border-color: #00ffff;
    background: rgba(0, 200, 255, 0.1);
    box-shadow: 0 0 25px rgba(0, 200, 255, 0.3);
    transform: scale(1.01);
  }

  .upload-area input[type="file"] {
    display: none;
  }

  .upload-icon {
    font-size: 2.4rem;
    display: block;
    margin-bottom: 10px;
    animation: iconPulse 2s ease-in-out infinite;
  }

  .upload-text {
    color: #d0d0ff;
    font-size: 0.95rem;
    font-weight: 600;
  }

  .upload-subtext {
    color: #8888cc;
    font-size: 0.78rem;
    margin-top: 5px;
  }

  /* Preview */
  .preview-wrapper {
    display: none;
    position: relative;
    margin-top: 12px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(0, 255, 255, 0.4);
    animation: fadeDown 0.5s ease;
  }

  .preview-wrapper.show { display: block; }

  .preview-wrapper img {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    display: block;
    background: rgba(0, 0, 0, 0.4);
  }

  .remove-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255, 0, 60, 0.9);
    border: none;
    color: #fff;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(255, 0, 60, 0.5);
  }

  .remove-btn:hover {
    background: #ff003c;
    transform: scale(1.15) rotate(90deg);
  }

  .file-name {
    display: none;
    margin-top: 8px;
    font-size: 0.8rem;
    color: #00ffff;
    text-align: center;
    word-break: break-all;
  }

  .file-name.show { display: block; }

  /* Price Display */
  .price-display {
    background: linear-gradient(90deg, rgba(255, 0, 204, 0.15), rgba(0, 200, 255, 0.15));
    border: 1px solid rgba(255, 0, 204, 0.3);
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    margin: 20px 0;
    animation: priceGlow 2s ease-in-out infinite;
  }

  @keyframes priceGlow {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 204, 0.2); }
    50% { box-shadow: 0 0 25px rgba(255, 0, 204, 0.5); }
  }

  .price-display span {
    font-size: 0.85rem;
    color: #b0b0ff;
    display: block;
    margin-bottom: 5px;
  }

  .price-display strong {
    font-size: 1.6rem;
    background: linear-gradient(90deg, #ff00cc, #00ffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(90deg, #ff00cc, #3333ff, #00ffff);
    background-size: 200% 200%;
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.4s;
    animation: gradientMove 3s ease infinite;
    box-shadow: 0 10px 30px rgba(255, 0, 204, 0.4);
  }

  .submit-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 15px 45px rgba(255, 0, 204, 0.7);
  }

  .submit-btn:active { transform: scale(0.98); }

  .success-msg {
    display: none;
    margin-top: 20px;
    padding: 18px;
    background: rgba(0, 255, 128, 0.15);
    border: 1px solid rgba(0, 255, 128, 0.5);
    border-radius: 12px;
    text-align: center;
    color: #00ff88;
    font-weight: 600;
    animation: fadeDown 0.5s ease;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: #8888cc;
    font-size: 0.85rem;
  }

  .contact {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 25px;
    background: linear-gradient(90deg, rgba(255, 0, 204, 0.2), rgba(0, 200, 255, 0.2));
    border: 1px solid rgba(255, 0, 204, 0.4);
    border-radius: 30px;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s;
  }

  .contact:hover {
    background: linear-gradient(90deg, rgba(255, 0, 204, 0.4), rgba(0, 200, 255, 0.4));
    transform: scale(1.05);
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #1a1a2e; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(#ff00cc, #00ffff);
    border-radius: 10px;
  }

  @media (max-width: 500px) {
    .logo { font-size: 2.2rem; }
    .order-section { padding: 25px 20px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">DG STORE</div>
    <div class="tagline">⚡ PREMIUM ACCOUNTS • BEST PRICES ⚡</div>
  </header>

  <div class="section-title"><span>🔥 PREMIUM ACCOUNTS 🔥</span></div>

  <div class="grid" id="productGrid"></div>

  <div class="section-title" style="margin-top:50px;"><span>🛒 PLACE YOUR ORDER</span></div>

  <section class="order-section" id="orderSection">
    <h2>Order Form</h2>
    <form id="orderForm">
      <div class="form-group">
        <label>👤 Your Name</label>
        <input type="text" id="customerName" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label>📦 Package</label>
        <select id="packageSelect" required>
          <option value="">-- Select a package --</option>
        </select>
      </div>

      <div class="form-group">
        <label>⏱️️ Duration / Plan</label>
        <select id="durationSelect" required>
          <option value="">-- Select duration --</option>
        </select>
      </div>

      <!-- ===== RECEIPT UPLOAD ===== -->
      <div class="form-group">
        <label>🧾 Payment Receipt (Image)</label>

        <label for="receiptInput" class="upload-area" id="uploadArea">
          <input type="file" id="receiptInput" accept="image/*">
          <span class="upload-icon">📤</span>
          <div class="upload-text">Click or drag & drop your receipt here</div>
          <div class="upload-subtext">PNG, JPG, JPEG • Max 5MB</div>
        </label>

        <div class="preview-wrapper" id="previewWrapper">
          <button type="button" class="remove-btn" id="removeBtn" title="Remove">✕</button>
          <img id="previewImg" src="" alt="Receipt Preview">
        </div>

        <div class="file-name" id="fileName"></div>
      </div>

      <div class="price-display">
        <span>Total Price</span>
        <strong id="autoPrice">LKR 0</strong>
      </div>

      <button type="submit" class="submit-btn">🚀 SUBMIT ORDER</button>
    </form>

    <div class="success-msg" id="successMsg"></div>
  </section>

  <footer>
    <div>© 2024 DG STORE — Premium Accounts</div>
    <a href="#" class="contact">📩 DM NOW TO ORDER</a>
  </footer>

<script>
  // ============ PRODUCT DATA ============
  const products = [
    {
      icon: "📊",
      title: "TRADINGVIEW",
      plans: [
        { name: "1 Month", type: "Shared Account", price: 1200 },
        { name: "3 Months", type: "Shared Account", price: 3500 },
        { name: "6 Months", type: "Shared Account", price: 6500 },
        { name: "1 Month", type: "Private Account", price: 3000 }
      ]
    },
    {
      icon: "🤖",
      title: "GEMINI",
      plans: [
        { name: "18 Months", type: "Owner Mail", price: 1500 }
      ]
    },
    {
      icon: "🎬",
      title: "CAPCUT PRO",
      plans: [
        { name: "1 Month", type: "Private Account", price: 800 },
        { name: "3 Months", type: "Private Account", price: 2200 }
      ]
    },
    {
      icon: "▶️",
      title: "YOUTUBE PREMIUM",
      plans: [
        { name: "1 Month", type: "Private Account", price: 700 },
        { name: "3 Months", type: "Private Account", price: 2500 },
        { name: "6 Months", type: "Private Account", price: 3500 }
      ]
    },
    {
      icon: "🎵",
      title: "SPOTIFY PREMIUM",
      plans: [
        { name: "1 Month", type: "Private Account", price: 700 },
        { name: "3 Months", type: "Private Account", price: 1500 },
        { name: "6 Months", type: "Private Account", price: 2000 }
      ]
    },
    {
      icon: "🤖",
      title: "CLAUDE API",
      plans: [
        { name: "$100 API — 30 Days", type: "Full Warranty", price: 1850 }
      ]
    },
    {
      icon: "💻",
      title: "LOVABLE",
      plans: [
        { name: "Lifetime Access", type: "Unlimited Credits", price: 1500 }
      ]
    },
    {
      icon: "🎧",
      title: "TIDAL",
      plans: [
        { name: "1 Month", type: "Individual Private", price: 500 },
        { name: "1 Month", type: "Family (up to 5 members)", price: 1000 }
      ]
    }
  ];

  // ============ RENDER CARDS ============
  const grid = document.getElementById('productGrid');

  products.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.1) + 's';

    let plansHTML = '';
    p.plans.forEach(plan => {
      plansHTML += `
        <div class="plan">
          <div class="plan-info">
            ${plan.name}
            <span class="plan-type">${plan.type}</span>
          </div>
          <div class="price">LKR ${plan.price.toLocaleString()}</div>
        </div>
      `;
    });

    card.innerHTML = `
      <div class="card-inner">
        <div class="card-header">
          <div class="icon">${p.icon}</div>
          <div class="card-title">${p.title}</div>
        </div>
        ${plansHTML}
      </div>
    `;

    card.addEventListener('click', () => {
      const packageSelect = document.getElementById('packageSelect');
      packageSelect.value = p.title;
      packageSelect.dispatchEvent(new Event('change'));
      document.getElementById('orderSection').scrollIntoView({ behavior: 'smooth' });
    });

    grid.appendChild(card);
  });

  // ============ SCROLL ANIMATION ============
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.card, .order-section').forEach(el => observer.observe(el));

  // ============ ORDER FORM LOGIC ============
  const packageSelect = document.getElementById('packageSelect');
  const durationSelect = document.getElementById('durationSelect');
  const autoPrice = document.getElementById('autoPrice');
  const orderForm = document.getElementById('orderForm');
  const successMsg = document.getElementById('successMsg');

  // Populate package dropdown
  products.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.title;
    opt.textContent = `${p.icon} ${p.title}`;
    packageSelect.appendChild(opt);
  });

  packageSelect.addEventListener('change', () => {
    durationSelect.innerHTML = '<option value="">-- Select duration --</option>';
    autoPrice.textContent = 'LKR 0';

    const selected = products.find(p => p.title === packageSelect.value);
    if (!selected) return;

    selected.plans.forEach((plan, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${plan.name} — ${plan.type} — LKR ${plan.price.toLocaleString()}`;
      opt.dataset.price = plan.price;
      durationSelect.appendChild(opt);
    });
  });

  durationSelect.addEventListener('change', () => {
    const opt = durationSelect.options[durationSelect.selectedIndex];
    if (opt && opt.dataset.price) {
      autoPrice.textContent = 'LKR ' + parseInt(opt.dataset.price).toLocaleString();
    } else {
      autoPrice.textContent = 'LKR 0';
    }
  });

  // ============ RECEIPT UPLOAD LOGIC ============
  const receiptInput = document.getElementById('receiptInput');
  const uploadArea = document.getElementById('uploadArea');
  const previewWrapper = document.getElementById('previewWrapper');
  const previewImg = document.getElementById('previewImg');
  const removeBtn = document.getElementById('removeBtn');
  const fileName = document.getElementById('fileName');

  const MAX_SIZE = 5 * 1024 * 1024; // 5MB

  function handleFile(file) {
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      alert('⚠️ Please upload an image file (PNG, JPG, JPEG)');
      return;
    }

    if (file.size > MAX_SIZE) {
      alert('⚠️ File too large! Maximum size is 5MB.');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      previewImg.src = e.target.result;
      previewWrapper.classList.add('show');
      fileName.textContent = '📎 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
      fileName.classList.add('show');
      uploadArea.style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  receiptInput.addEventListener('change', (e) => {
    handleFile(e.target.files[0]);
  });

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) {
      const dt = new DataTransfer();
      dt.items.add(file);
      receiptInput.files = dt.files;
      handleFile(file);
    }
  });

  removeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    resetUpload();
  });

  function resetUpload() {
    receiptInput.value = '';
    previewImg.src = '';
    previewWrapper.classList.remove('show');
    fileName.classList.remove('show');
    fileName.textContent = '';
    uploadArea.style.display = 'block';
  }

  // ============ SUBMIT (TELEGRAM API CONNECTED) ============
  orderForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('customerName').value.trim();
    const pkg = packageSelect.value;
    const durIdx = durationSelect.value;
    const price = autoPrice.textContent;
    const receiptFile = receiptInput.files[0];

    if (!name || !pkg || durIdx === '') {
      alert('⚠️ Please fill all fields!');
      return;
    }

    if (!receiptFile) {
      alert('⚠️ Please upload your payment receipt image!');
      return;
    }

    const selectedProduct = products.find(p => p.title === pkg);
    const selectedPlan = selectedProduct.plans[durIdx];

    const formData = new FormData();
    formData.append('name', name);
    formData.append('packageName', pkg);
    formData.append('duration', `${selectedPlan.name} (${selectedPlan.type})`);
    formData.append('price', price);
    formData.append('receipt', receiptFile);

    successMsg.innerHTML = `⏳ Sending order to Telegram...`;
    successMsg.style.display = 'block';

    try {
      const response = await fetch('https://oder-box-test-telegram-bot.vercel.app/api/order', {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (result.success) {
        successMsg.innerHTML = `
          ✅ Order placed & sent to Telegram successfully!<br>
          <small style="color:#b0b0ff; display:block; margin-top:8px;">
            👤 ${name} • ${pkg} • ${selectedPlan.name} • ${selectedPlan.type} • ${price}
          </small>
        `;
        orderForm.reset();
        durationSelect.innerHTML = '<option value="">-- Select duration --</option>';
        autoPrice.textContent = 'LKR 0';
        resetUpload();
      } else {
        successMsg.innerHTML = `❌ Failed to send order. Please try again.`;
      }
    } catch (err) {
      console.error(err);
      successMsg.innerHTML = `❌ Network error! Check your connection.`;
    }

    setTimeout(() => {
      successMsg.style.display = 'none';
    }, 7000);

    successMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Initial animation
  window.addEventListener('load', () => {
    document.querySelectorAll('.card').forEach((c, i) => {
      setTimeout(() => c.classList.add('visible'), i * 100);
    });
    setTimeout(() => {
      document.getElementById('orderSection').classList.add('visible');
    }, 800);
  });
</script>

</body>
</html>
